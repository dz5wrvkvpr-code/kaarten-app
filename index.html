<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OV Utrecht">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Toepassingsgebied OV Utrecht</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: kaart schermvullend, zoekbalk boven, uitschuifpaneel onder */
:root{
  --bg:#f4f6f5; --panel:#ffffff; --fg:#1d2723; --muted:#5d6b65; --line:#d6ddd9;
  --accent:#b8202a; /* provinciaal rood */
  --in:#1f7a46; --in-bg:#e3f2e8; --out:#6b4a00; --out-bg:#fbf0d6; --err-bg:#f9e1e1;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121816; --panel:#1b2320; --fg:#e7ece9; --muted:#9aa8a1; --line:#2e3a35;
  --accent:#ff6b6b; --in:#7fd6a0; --in-bg:#163524; --out:#f1c86a; --out-bg:#3a2f12; --err-bg:#3c1d1d; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);overflow:hidden}
#map{position:fixed;inset:0;background:var(--bg)}
.top{position:fixed;z-index:1000;top:calc(env(safe-area-inset-top,0px) + 10px);
  left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.search{flex:1;min-width:0;position:relative}
#q{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;
  background:var(--panel);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.15)}
#sugg{position:absolute;top:48px;left:0;right:0;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#sugg button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--fg);
  padding:11px 12px;font:inherit;border-bottom:1px solid var(--line)}
#sugg button:last-child{border-bottom:0}
.btn{height:44px;min-width:44px;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  color:var(--fg);font:600 14px var(--font);padding:0 12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.btn:focus-visible,#q:focus-visible,#sugg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet{position:fixed;z-index:1000;left:0;right:0;bottom:0;background:var(--panel);
  border-radius:16px 16px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.18);max-height:62%;overflow:auto;
  padding-block:10px calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.status{border-radius:10px;padding:10px 12px;margin-bottom:12px}
.status.in{background:var(--in-bg);color:var(--in)}
.status.out{background:var(--out-bg);color:var(--out)}
.status.err{background:var(--err-bg)}
.status.idle{background:var(--bg);color:var(--muted)}
.status b{display:block;font-size:17px}
.status ul{margin:6px 0 0;padding-left:18px;color:var(--fg)}
.coord{font:12px var(--mono);color:var(--muted)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{font-weight:600;cursor:pointer;padding:6px 0}
.grp{margin:8px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
label.ly{display:flex;align-items:flex-start;gap:10px;padding:7px 0}
label.ly input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.leaflet-control-attribution{font-size:10px}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Kaart"></div>

<div class="top">
  <div class="search">
    <input id="q" type="search" placeholder="Adres of plaats zoeken" autocomplete="off" aria-label="Adres zoeken">
    <div id="sugg" hidden></div>
  </div>
  <button class="btn" id="gps" aria-label="Mijn locatie controleren">📍</button>
</div>

<section class="sheet" aria-live="polite">
  <div class="grip"></div>
  <div id="status" class="status idle"><b>Tik op de kaart of gebruik 📍</b>Dan zie je direct of de locatie in een toepassingsgebied ligt.</div>
  <details id="lagen">
    <summary>Kaartlagen</summary>
    <div id="layerlist"><span class="coord">Lagen laden…</span></div>
  </details>
  <p class="note">Bron: Omgevingsverordening provincie Utrecht (geodata-utrecht.nl). Indicatief hulpmiddel; de vastgestelde werkingsgebieden op omgevingswet.overheid.nl zijn leidend.</p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  const WMS = "https://services.geodata-utrecht.nl/geoserver/Omgevingsverordening/wms";
  const FALLBACK_LAYER = "Omgevingsverordening_Provincie_Utrecht";

  // Werkingsgebieden per afdeling (zoektermen worden gematcht op laagnaam/-titel)
  const AFDELINGEN = [
    {id:"2.3", titel:"Afdeling 2.3 Activiteiten in water", termen:["zwemlocatie","gebied ligplaatsen","ligplaats","dempen"]},
    {id:"3.4", titel:"Afdeling 3.4 Grondverzet en rommelterrein", termen:["landelijk gebied"]},
    {id:"3.5", titel:"Afdeling 3.5 Gesloten stortplaats", termen:["gesloten stortplaats","stortplaats"]},
    {id:"4.2", titel:"Afdeling 4.2 Provinciale weg", termen:["beperkingengebied beheer provinciale weg","beperkingengebied bouwwerken provinciale weg","beperkingengebied vrij zicht provinciale weg","provinciale weg"]},
    {id:"7.2", titel:"Afdeling 7.2 Kwaliteit landschap", termen:["gebied landschappelijke waarden","landschappelijke waarden"]}
  ];
  const KLEUREN = {"2.3":"#1f6fb2","3.4":"#6a8f2a","3.5":"#8a4fa3","4.2":"#c4471b","7.2":"#a07c12"};

  const norm = s => (s||"").toLowerCase().replace(/[_\-]+/g," ").replace(/\s+/g," ").trim();
  const store = {
    get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  };

  // Kaart
  const map = L.map("map",{zoomControl:false,attributionControl:true}).setView([52.08,5.20],10);
  L.tileLayer("https://service.pdok.nl/brt/achtergrondkaart/wmts/v2_0/standaard/EPSG:3857/{z}/{x}/{y}.png",
    {maxZoom:19,attribution:'Kaart: <a href="https://www.pdok.nl">PDOK</a> | Data: Provincie Utrecht'}).addTo(map);

  let layers = [];          // {name,title,afd}
  const wmsLayers = {};     // name -> L.tileLayer.wms
  let actief = new Set(store.get("ovu_actief") || []);
  let marker = null;

  function addWms(name){
    if(wmsLayers[name]) return;
    wmsLayers[name] = L.tileLayer.wms(WMS,{layers:name,format:"image/png",transparent:true,version:"1.3.0",opacity:.55,maxZoom:19}).addTo(map);
  }
  function removeWms(name){ if(wmsLayers[name]){ map.removeLayer(wmsLayers[name]); delete wmsLayers[name]; } }

  function renderLayerList(waarschuwing){
    const box = document.getElementById("layerlist");
    box.textContent = "";
    if(waarschuwing){ const p=document.createElement("p"); p.className="note"; p.textContent=waarschuwing; box.appendChild(p); }
    const groepen = AFDELINGEN.map(a=>({...a, items:layers.filter(l=>l.afd===a.id)}));
    groepen.push({id:"overig",titel:"Overige lagen in de verordening",items:layers.filter(l=>!l.afd)});
    for(const g of groepen){
      if(!g.items.length && g.id==="overig") continue;
      const h=document.createElement("div"); h.className="grp"; h.textContent=g.titel; box.appendChild(h);
      if(!g.items.length){ const s=document.createElement("div"); s.className="coord"; s.textContent="Geen aparte laag gevonden; zie Overige lagen."; box.appendChild(s); continue; }
      for(const l of g.items){
        const lab=document.createElement("label"); lab.className="ly";
        const cb=document.createElement("input"); cb.type="checkbox"; cb.id="ly_"+l.name; cb.checked=actief.has(l.name);
        cb.addEventListener("change",()=>{ cb.checked?(actief.add(l.name),addWms(l.name)):(actief.delete(l.name),removeWms(l.name)); store.set("ovu_actief",[...actief]); });
        const t=document.createElement("span"); t.textContent=l.title||l.name;
        lab.append(cb,t); box.appendChild(lab);
      }
    }
  }

  async function loadCapabilities(){
    try{
      const r = await fetch(WMS+"?service=WMS&request=GetCapabilities&version=1.3.0");
      if(!r.ok) throw new Error("HTTP "+r.status);
      const xml = new DOMParser().parseFromString(await r.text(),"text/xml");
      const nodes = [...xml.getElementsByTagName("Layer")].filter(n=>n.getAttribute("queryable")!==null || n.querySelector(":scope > Name"));
      layers = [];
      for(const n of nodes){
        const nameEl=[...n.children].find(c=>c.localName==="Name"); if(!nameEl) continue;
        const titleEl=[...n.children].find(c=>c.localName==="Title");
        const name=nameEl.textContent.trim(), title=titleEl?titleEl.textContent.trim():name;
        const hay=norm(name+" "+title);
        const a=AFDELINGEN.find(a=>a.termen.some(t=>hay.includes(t)));
        layers.push({name,title,afd:a?a.id:null});
      }
      if(!layers.length) throw new Error("geen lagen");
      if(!store.get("ovu_actief")) actief = new Set(layers.filter(l=>l.afd).map(l=>l.name));
      if(!actief.size) actief = new Set([layers[0].name]);
      renderLayerList(layers.some(l=>l.afd)?null:"De kaartdienst levert de werkingsgebieden als één gecombineerde laag. Tik op de kaart: de uitslag noemt welk werkingsgebied het is.");
    }catch(e){
      layers=[{name:FALLBACK_LAYER,title:"Omgevingsverordening (alle werkingsgebieden)",afd:null}];
      actief=new Set([FALLBACK_LAYER]);
      renderLayerList("De lijst met lagen kon niet worden opgehaald ("+e.message+"). De gecombineerde laag wordt getoond.");
    }
    actief.forEach(n=>{ if(layers.some(l=>l.name===n)) addWms(n); });
  }

  function setStatus(cls,html){ const s=document.getElementById("status"); s.className="status "+cls; s.innerHTML=html; }
  const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

  // Geef een leesbare naam van het werkingsgebied uit een feature
  function featureNaam(f, laag){
    const p=f.properties||{};
    const kand=["naam","Naam","NAAM","werkingsgebied","Werkingsgebied","noemer","Noemer","omschrijving","titel","label","name"];
    for(const k of kand) if(p[k]) return String(p[k]);
    const vals=Object.values(p).filter(v=>typeof v==="string" && v.length>2 && v.length<120);
    return vals[0] || (laag.title||laag.name);
  }

  async function checkPoint(latlng){
    if(marker) marker.setLatLng(latlng); else marker=L.marker(latlng).addTo(map);
    const q=[...actief]; const coord=`${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
    if(!q.length){ setStatus("idle","<b>Geen lagen aan</b>Zet onder Kaartlagen minimaal één laag aan."); return; }
    setStatus("idle","<b>Controleren…</b><span class='coord'>"+coord+"</span>");
    // Klein vierkant rond het punt (ca. 2 m) in Web Mercator
    const p=L.CRS.EPSG3857.project(latlng), d=1;
    const url=WMS+"?service=WMS&version=1.3.0&request=GetFeatureInfo&crs=EPSG:3857"
      +"&bbox="+[p.x-d,p.y-d,p.x+d,p.y+d].join(",")+"&width=3&height=3&i=1&j=1"
      +"&layers="+encodeURIComponent(q.join(","))+"&query_layers="+encodeURIComponent(q.join(","))
      +"&info_format=application/json&feature_count=50";
    try{
      const r=await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status);
      const j=await r.json(); const fs=j.features||[];
      const treffers=new Map();
      for(const f of fs){
        const lname=(f.id||"").split(".")[0];
        const laag=layers.find(l=>l.name===lname || l.name.endsWith(":"+lname)) || {name:lname,title:lname,afd:null};
        const afd=laag.afd?AFDELINGEN.find(a=>a.id===laag.afd):null;
        const key=(afd?afd.titel:"Werkingsgebied")+" — "+featureNaam(f,laag);
        treffers.set(key,true);
      }
      if(treffers.size){
        setStatus("in","<b>Binnen toepassingsgebied</b><ul>"+[...treffers.keys()].map(k=>"<li>"+esc(k)+"</li>").join("")+"</ul><div class='coord' style='margin-top:6px'>"+coord+"</div>");
      }else{
        setStatus("out","<b>Niet in de aangezette gebieden</b>Geen van de "+q.length+" actieve lagen ligt op dit punt.<div class='coord' style='margin-top:6px'>"+coord+"</div>");
      }
    }catch(e){
      setStatus("err","<b>Automatische controle lukt niet</b>Kijk op de kaart of het punt in een gekleurd vlak valt. ("+esc(e.message)+")<div class='coord' style='margin-top:6px'>"+coord+"</div>");
    }
  }

  map.on("click",e=>checkPoint(e.latlng));

  document.getElementById("gps").addEventListener("click",()=>{
    if(!navigator.geolocation){ setStatus("err","<b>Locatie niet beschikbaar</b>Je browser ondersteunt geen locatiebepaling."); return; }
    setStatus("idle","<b>Locatie bepalen…</b>");
    navigator.geolocation.getCurrentPosition(pos=>{
      const ll=L.latLng(pos.coords.latitude,pos.coords.longitude);
      map.setView(ll,17); checkPoint(ll);
    },err=>{
      setStatus("err","<b>Locatie niet gevonden</b>"+(err.code===1?"Sta locatietoegang toe voor Safari: Instellingen › Privacy › Locatievoorzieningen.":"Probeer het opnieuw buiten of zoek op adres."));
    },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  });

  // Adres zoeken via PDOK Locatieserver
  const qEl=document.getElementById("q"), sugg=document.getElementById("sugg"); let t=null;
  qEl.addEventListener("input",()=>{
    clearTimeout(t); const v=qEl.value.trim(); if(v.length<3){ sugg.hidden=true; return; }
    t=setTimeout(async()=>{
      try{
        const r=await fetch("https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?rows=6&fl=weergavenaam,centroide_ll&q="+encodeURIComponent(v));
        const j=await r.json(); const docs=(j.response&&j.response.docs)||[];
        sugg.textContent="";
        for(const d of docs){
          const m=/POINT\(([-\d.]+) ([-\d.]+)\)/.exec(d.centroide_ll||""); if(!m) continue;
          const b=document.createElement("button"); b.type="button"; b.textContent=d.weergavenaam;
          b.addEventListener("click",()=>{ const ll=L.latLng(+m[2],+m[1]); sugg.hidden=true; qEl.value=d.weergavenaam; qEl.blur(); map.setView(ll,17); checkPoint(ll); });
          sugg.appendChild(b);
        }
        sugg.hidden=!sugg.children.length;
      }catch(e){ sugg.hidden=true; }
    },250);
  });
  qEl.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const f=sugg.querySelector("button"); if(f){ e.preventDefault(); f.click(); } } });

  loadCapabilities();
})();
</script>
</body>
</html>
